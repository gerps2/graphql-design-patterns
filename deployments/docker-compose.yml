# Banco e cache da corretora para desenvolvimento local.
# A senha abaixo só vale nesta máquina. Em produção, ela vem de um cofre de segredos.
name: corretora

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: corretora
      POSTGRES_PASSWORD: corretora_dev
      POSTGRES_DB: corretora
    ports:
      - "5433:5432"
    volumes:
      - dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corretora -d corretora"]
      interval: 2s
      timeout: 3s
      retries: 30

  # O L2 do HybridCache. Uso interno, coberto pela licença do Redis 8 (RSALv2/SSPLv1/AGPLv3).
  redis:
    image: docker.io/library/redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dados:
